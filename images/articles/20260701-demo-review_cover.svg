<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201E1B"/>
      <stop offset="1" stop-color="#3A332B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="533" fill="url(#bg)"/>
  <!-- 银幕光晕 -->
  <rect x="0" y="0" width="800" height="3" fill="#B99A5B" opacity="0.7"/>
  <rect x="0" y="530" width="800" height="3" fill="#B99A5B" opacity="0.7"/>
