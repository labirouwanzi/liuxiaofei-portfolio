  <rect x="120" y="90" width="560" height="350" fill="#0C0B0A"/>
  <rect x="130" y="100" width="540" height="330" fill="none" stroke="#F7F2E9" stroke-width="2" opacity="0.85"/>
  <circle cx="400" cy="265" r="70" fill="none" stroke="#9E2B25" stroke-width="2" opacity="0.9"/>
